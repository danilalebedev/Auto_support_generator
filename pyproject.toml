[project]
name = "si-generator"
version = "0.1.2"
description = "Generate organic chemistry Supporting Information DOCX files from tabular compound data."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2,<2",
    "olefile",
    "python-docx",
    "pywin32; platform_system == 'Windows'",
    "rdkit",
    "gemmi>=0.7,<0.8",
    "matplotlib>=3.8,<4",
    "numpy>=1.26",
    "Pillow>=10",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
si-generator = "si_generator.cli:main"
si-generator-gui = "si_generator.gui:main"
si-procedure-import = "si_generator.procedure_import_cli:main"

[tool.setuptools.package-data]
"si_generator" = [
    "resources/scripts/*.qs",
    "resources/assets/*.png",
    "resources/reagents/*.json",
    "resources/mngp_styles/*.mngp",
    "templates/*.docx",
    "templates/journals/*.docx",
    "templates/journals/*.json",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
